name: Full Stack CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  front-end:
    name: Front End CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: unify-front-end/node_modules
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Install dependencies
        working-directory: unify-front-end
        run: npm install

      - name: Run TypeScript
        working-directory: unify-front-end
        run: npx tsc --noEmit

      - name: Build the project (Native platforms only)
        working-directory: unify-front-end
        env:
          CI: true
        run: npx expo export --platform ios --platform android

      - name: Deploy
        working-directory: unify-front-end
        run: npm run deploy

