- description: "Pakistani internationally-trained nurse asks about credential recognition"
  vars:
    prompt: "I am a registered nurse from Pakistan — how do I get my credentials recognized to work in Canada?"
    profile:
      persona: professional
      country_of_origin: Pakistan
      province: Saskatchewan
      city: Saskatoon
      immigration_status: permanent_resident_express_entry
      arrival_date: "2025-01-15"
      goals:
        - find_skilled_work
        - get_credentials_recognized
      learning_interests:
        - credential_recognition
        - job_search
        - healthcare
    profile_summary: "Pakistani internationally-trained nurse, new PR in Saskatchewan"
    expected_tailoring: "Should mention NNAS (National Nursing Assessment Service), provincial regulator (College of Registered Nurses of Saskatchewan / CRNS), and bridging programs; should not promise licensure outcome"
  assert:
    - type: javascript
      value: |
        output.length > 80 && output.length < 3000
    - type: icontains-any
      value:
        - "NNAS"
        - "College"
        - "regulator"
        - "credential"
    - type: not-contains
      value: "you will be licensed"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt
    - type: llm-rubric
      rubric: file://judges/personalization.txt
    - type: llm-rubric
      rubric: file://judges/safety.txt
