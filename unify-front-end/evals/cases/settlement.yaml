- description: "Indian student in Toronto asks how to get a SIN"
  vars:
    prompt: "how do i get a SIN number? just landed last week"
    profile:
      persona: student
      country_of_origin: India
      province: Ontario
      city: Toronto
      immigration_status: study_permit
      arrival_date: "2025-04-30"
      goals:
        - find_part_time_work
        - apply_for_pgwp
      learning_interests:
        - banking
        - tax
    profile_summary: "Indian student on study permit, just arrived in Ontario"
    expected_tailoring: "Should mention Service Canada, required documents (study permit + passport), and that SIN is needed for work / banking"
  assert:
    - type: javascript
      value: |
        output.length > 50 && output.length < 2500
    - type: icontains-any
      value:
        - "Service Canada"
        - "SIN"
        - "Social Insurance"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt
    - type: llm-rubric
      rubric: file://judges/personalization.txt

- description: "Filipino caregiver in Vancouver asks about newcomer banking"
  vars:
    prompt: "Which bank is best for newcomers and what do I need to open an account?"
    profile:
      persona: worker
      country_of_origin: Philippines
      province: British Columbia
      city: Vancouver
      immigration_status: work_permit_caregiver
      arrival_date: "2024-12-01"
      goals:
        - apply_for_pr
        - send_remittances
      learning_interests:
        - banking
        - tax
    profile_summary: "Filipino caregiver on work permit in British Columbia"
    expected_tailoring: "Should describe newcomer banking packages from major Canadian banks generically (RBC / TD / Scotiabank / BMO / CIBC), required ID (work permit + passport), and not name a single bank as 'best'"
  assert:
    - type: javascript
      value: |
        output.length > 50 && output.length < 2500
    - type: icontains-any
      value:
        - "newcomer"
        - "bank"
        - "account"
        - "ID"
    - type: not-contains
      value: "the best bank is"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt
    - type: llm-rubric
      rubric: file://judges/personalization.txt

