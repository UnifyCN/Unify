- description: "Driver's license — Ontario student profile (expects Ontario-specific guidance)"
  vars:
    prompt: "How do I get a driver's license?"
    profile:
      persona: student
      country_of_origin: India
      province: Ontario
      city: Toronto
      immigration_status: study_permit
      arrival_date: "2024-09-01"
      goals:
        - find_part_time_work
      learning_interests:
        - transit
    profile_summary: "Indian student on study permit, currently in Ontario"
    expected_tailoring: "Should reference Ontario-specific licensing (G1/G2/G), ServiceOntario or DriveTest, and not give BC-specific guidance"
  assert:
    - type: javascript
      value: |
        output.length > 50 && output.length < 2500
    - type: icontains-any
      value:
        - "G1"
        - "G2"
        - "Ontario"
        - "ServiceOntario"
        - "DriveTest"
    - type: not-contains
      value: "ICBC"
    - type: llm-rubric
      rubric: file://judges/personalization.txt
    - type: llm-rubric
      rubric: file://judges/anti-stereotype.txt

