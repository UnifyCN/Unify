    profile:
      persona: student
      country_of_origin: India
      province: Ontario
      city: Toronto
      immigration_status: study_permit
      arrival_date: "2024-09-01"
      goals:
        - find_part_time_work
      learning_interests:
        - banking
    profile_summary: "Indian student on study permit in Ontario"
