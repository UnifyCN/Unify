- description: "Fact-check FALSE rumor — PR loss after 6 months abroad"
  vars:
    prompt: "Is it true that PR holders can lose status if they leave Canada for 6 months?"
    profile:
      persona: professional
      country_of_origin: Nigeria
      province: Alberta
      city: Calgary
      immigration_status: permanent_resident_express_entry
      arrival_date: "2024-11-20"
      goals:
        - find_skilled_work
      learning_interests:
        - pr_pathways
    profile_summary: "Nigerian Express Entry PR in Alberta"
    expected_verdict: "false"
    expected_tailoring: "Should clarify the actual rule (730 days physical presence in any 5-year period) and label the 6-month claim as inaccurate; should refer to IRCC for confirmation"
  assert:
    - type: javascript
      value: |
        return output.length > 80 && output.length < 3000
    - type: icontains-any
      value:
        - "730"
        - "two years"
        - "five years"
        - "residency obligation"
        - "physical presence"
    - type: icontains-any
      value:
        - "not accurate"
        - "incorrect"
        - "inaccurate"
        - "not true"
        - "myth"
        - "actually"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/safety.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt

- description: "Fact-check PARTIAL — citizenship after 3 years on work permit"
  vars:
    prompt: "I heard you can apply for citizenship after 3 years on a work permit — is that right?"
    profile:
      persona: worker
      country_of_origin: Philippines
      province: British Columbia
      city: Vancouver
      immigration_status: work_permit_caregiver
      arrival_date: "2023-04-15"
      goals:
        - apply_for_pr
      learning_interests:
        - pr_pathways
    profile_summary: "Filipino caregiver in BC on work permit"
    expected_verdict: "partial"
    expected_tailoring: "Should hedge: citizenship requires PR + 1095 days physical presence in last 5 years, with up to 365 days as non-PR (work permit) counting as half-days. So the 3-year claim mixes accurate elements with a misconception."
  assert:
    - type: javascript
      value: |
        return output.length > 80 && output.length < 3000
    - type: icontains-any
      value:
        - "1095"
        - "1,095"
        - "permanent resident"
        - "PR"
        - "physical presence"
    - type: icontains-any
      value:
        - "not exactly"
        - "partially"
        - "more nuance"
        - "however"
        - "actually"
        - "clarif"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/safety.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt

- description: "Fact-check VERIFIABLE — Ontario prescription drug coverage under 25"
  vars:
    prompt: "Can you verify if Ontario covers prescription drugs for under-25?"
    profile:
      persona: family
      country_of_origin: India
      province: Ontario
      city: Toronto
      immigration_status: permanent_resident_express_entry
      arrival_date: "2024-08-01"
      goals:
        - register_for_ohip
      learning_interests:
        - healthcare
    profile_summary: "Indian PR family in Ontario"
    expected_verdict: "true"
    expected_tailoring: "Should confirm OHIP+ exists for under-25s without private coverage, note recent eligibility changes (those with private insurance use that first since 2019), and refer to ServiceOntario / Ministry of Health for current rules"
  assert:
    - type: javascript
      value: |
        return output.length > 80 && output.length < 3000
    - type: icontains-any
      value:
        - "OHIP+"
        - "OHIP plus"
        - "under 25"
        - "Ontario Drug Benefit"
    - type: icontains-any
      value:
        - "Ministry of Health"
        - "ServiceOntario"
        - "verify"
        - "confirm"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/safety.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt
