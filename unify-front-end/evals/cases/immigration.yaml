    prompt: "spousal sponsorship — should I do inland or outland? whats the difference"
    profile:
      persona: family
      country_of_origin: Mexico
      province: Alberta
      city: Edmonton
      immigration_status: permanent_resident_express_entry
      arrival_date: "2023-02-10"
      goals:
        - sponsor_family
      learning_interests:
        - pr_pathways
        - legal_aid
    profile_summary: "Mexican PR in Alberta wanting to sponsor spouse"
    expected_tailoring: "Should explain inland (spouse already in Canada, can apply for OWP) vs outland (spouse abroad or in Canada, processed via visa office, allows appeal if refused), and recommend legal advice for personal situation"
  assert:
