- description: "Indian PR-hopeful asks how Express Entry CRS score is calculated"
  vars:
    prompt: "how is the CRS score calculated for express entry?"
    profile:
      persona: professional
      country_of_origin: India
      province: Ontario
      city: Mississauga
      immigration_status: work_permit_pgwp
      arrival_date: "2023-06-01"
      goals:
        - apply_for_pr
        - improve_crs_for_family
      learning_interests:
        - pr_pathways
        - job_search
    profile_summary: "Indian PGWP holder in Ontario aiming for Express Entry PR"
    expected_tailoring: "Should explain CRS components (core human capital, spouse, skill transferability, additional points like provincial nomination / job offer / Canadian education / French) and refer to IRCC's CRS tool; should not promise a score"
  assert:
    - type: javascript
      value: |
        return output.length > 80 && output.length < 3000
    - type: icontains-any
      value:
        - "CRS"
        - "Comprehensive Ranking"
        - "human capital"
        - "Express Entry"
    - type: not-contains
      value: "you will get"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt
    - type: llm-rubric
      rubric: file://judges/personalization.txt
    - type: llm-rubric
      rubric: file://judges/safety.txt

- description: "Pakistani professional in Saskatchewan asks about SINP eligibility"
  vars:
    prompt: "Am I eligible for SINP? I'm a software engineer here on a work permit"
    profile:
      persona: professional
      country_of_origin: Pakistan
      province: Saskatchewan
      city: Saskatoon
      immigration_status: work_permit_lmia
      arrival_date: "2024-03-01"
      goals:
        - apply_for_pr
        - find_skilled_work
      learning_interests:
        - pr_pathways
        - credential_recognition
    profile_summary: "Pakistani software engineer on work permit in Saskatchewan, exploring SINP"
    expected_tailoring: "Should describe SINP streams (Express Entry sub-category, International Skilled Worker, Saskatchewan Experience), criteria, and refer the user to the official SINP site without making an eligibility determination"
