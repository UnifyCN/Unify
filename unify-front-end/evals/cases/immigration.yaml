- description: "Indian study permit holder asks about post-grad work"
  vars:
    prompt: "Can I work after I graduate?"
    profile:
      persona: student
      country_of_origin: India
      province: Ontario
      city: Toronto
      immigration_status: study_permit
      arrival_date: "2024-09-01"
      goals:
        - find_part_time_work
        - apply_for_pgwp
      learning_interests:
        - banking
        - transit
        - tax
    profile_summary: "Indian student on study permit, currently in Ontario"
    expected_tailoring: "Should mention PGWP and reference study permit context"
  assert:
    - type: javascript
      value: |
        return output.length > 30 && output.length < 2000
    - type: contains
      value: "PGWP"
    - type: llm-rubric
      rubric: file://judges/faithfulness.txt
    - type: llm-rubric
      rubric: file://judges/relevance.txt
    - type: llm-rubric
      rubric: file://judges/personalization.txt

